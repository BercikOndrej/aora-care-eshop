services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aoracare
      POSTGRES_USER: aoracare
      POSTGRES_PASSWORD: aoracare
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aoracare -d aoracare']
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      SEQ_FIRSTRUN_NOAUTHENTICATION: 'true' # jen pro lokální dev — v produkci radši SEQ_FIRSTRUN_ADMINPASSWORD a auth zapnuté
    ports:
      - '5341:80' # UI + API + ingestion na jednom portu
    volumes:
      - seq-data:/data

volumes:
  postgres_data:
  seq-data:
